[project]
name = "cocapi"
version = "4.0.0"
description = "Async & sync Python wrapper for the Clash of Clans API with auto key management"
readme = "README.md"
authors = [{ name = "Tony Benoy", email = "me@tonybenoy.com" }]
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
keywords = [
    "clash-of-clans",
    "clash",
    "clans",
    "coc",
    "coc-api",
    "supercell",
    "api-wrapper",
    "async",
    "game-api",
]
dependencies = ["httpx>=0.23.0"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]
cli = ["typer>=0.9.0"]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.9",
]

[project.scripts]
cocapi = "cocapi.cli:app"

[project.urls]
Homepage = "https://github.com/tonybenoy/cocapi"
Documentation = "https://tonybenoy.github.io/cocapi/"
Repository = "https://github.com/tonybenoy/cocapi"
Issues = "https://github.com/tonybenoy/cocapi/issues"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["scripts/", "examples/", "tests/", ".cocapi/"]
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["cocapi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "ruff>=0.0.277",
    "mypy>=1.4.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.2",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.9",
]
